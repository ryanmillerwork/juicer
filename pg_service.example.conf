# Example libpq service definition for this project.
#
# Copy to ~/.pg_service.conf (or point PGSERVICEFILE at a file containing this),
# then connect using:
#   - PGSERVICE=juicer python3 capactive_calibration.py ...
#   - python3 capactive_calibration.py --db-service juicer ...
#
# Note: libpq typically reads passwords from ~/.pgpass (chmod 600), not here.

[juicer]
host=100.127.91.60
port=5432
dbname=home_automation
user=ryan
